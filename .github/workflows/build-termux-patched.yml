name: Build patched Termux APK (light extra-keys)

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: 'termux-app git ref (tag/branch/SHA)'
        required: false
        default: 'v0.119.0-beta.3'
  push:
    paths:
      - 'patches/termux-extrakeys-light.patch'
      - '.github/workflows/build-termux-patched.yml'

permissions:
  contents: read

jobs:
  build:
    # Mirrors upstream termux-app debug_build.yml: stock ubuntu-latest
    # runner already has the JDK + Android SDK/NDK this project builds with.
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (patch source)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Clone termux-app
        run: |
          git clone --recursive https://github.com/termux/termux-app.git termux-app
          cd termux-app
          git fetch --tags
          git checkout "${{ inputs.termux_ref || 'v0.119.0-beta.3' }}"
          git submodule update --init --recursive

      - name: Apply light extra-keys patch
        run: |
          cd termux-app
          git apply --verbose ../self/patches/termux-extrakeys-light.patch
          git diff --stat

      - name: Build debug APKs
        run: |
          cd termux-app
          ./gradlew assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-patched-light-extrakeys
          path: termux-app/app/build/outputs/apk/debug/*universal.apk
